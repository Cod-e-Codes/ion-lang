name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pin the action commit (v1 line). The toolchain version is `with:`, matching
      # rust-toolchain.toml. Do not use dtolnay/rust-toolchain@1.96.0; Dependabot
      # treats that tag as an action release and bumps it to a nonexistent Rust.
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check
      - run: cargo build --bin ion-lsp
      - run: cargo test
      - run: cargo clippy -- -D warnings

      - run: cargo build --release --bin ion-compiler --bin ion-lsp --bin ion-build
      - run: ./target/release/ion-compiler --version
      - run: ./target/release/ion-build --version

      - name: Integration tests (Linux)
        shell: bash
        env:
          COMPILER: ${{ github.workspace }}/target/release/ion-compiler
          ION_BUILD: ${{ github.workspace }}/target/release/ion-build
        run: cd tests && bash test_runner.sh

      - name: Generated C sanitizer smoke (Linux)
        shell: bash
        env:
          COMPILER: ${{ github.workspace }}/target/release/ion-compiler
          CC: gcc
          CFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
          LDFLAGS: -fsanitize=address,undefined
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          cd tests
          "$CC" $CFLAGS -c ../runtime/ion_runtime.c -I. -I.. -I../runtime -o .ion_test_runtime_san.o
          while IFS=' ' read -r test expected; do
            "$COMPILER" "$test.ion" >/dev/null
            "$CC" $CFLAGS "$test.c" .ion_test_runtime_san.o -I. -I.. -I../runtime -lpthread $LDFLAGS -o "$test"
            set +e
            "./$test" >/dev/null
            status=$?
            set -e
            if [ "$status" -ne "$expected" ]; then
              echo "$test: expected exit $expected, got $status"
              exit 1
            fi
            rm -f "$test.c" "$test"
          done <<'EOF'
          test_basic 42
          test_vec_push_pop 0
          test_string_push_byte 79
          test_spawn_channel 0
          test_array_to_slice_coercion 10
          EOF

      - name: Generated C leak sanitizer (Linux)
        shell: bash
        env:
          COMPILER: ${{ github.workspace }}/target/release/ion-compiler
          CC: gcc
          CFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
          LDFLAGS: -fsanitize=address,undefined
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          cd tests
          "$CC" $CFLAGS -c ../runtime/ion_runtime.c -I. -I.. -I../runtime -o .ion_test_runtime_lsan.o
          while IFS=' ' read -r test expected; do
            "$COMPILER" "$test.ion" >/dev/null
            "$CC" $CFLAGS "$test.c" .ion_test_runtime_lsan.o -I. -I.. -I../runtime -lpthread $LDFLAGS -o "$test"
            set +e
            "./$test" >/dev/null
            status=$?
            set -e
            if [ "$status" -ne "$expected" ]; then
              echo "$test: expected exit $expected, got $status"
              exit 1
            fi
            rm -f "$test.c" "$test"
          done <<'EOF'
          test_box_ops 0
          test_box_new_struct_let 10
          test_box_new_struct_let_annotated 10
          test_box_unwrap_same_scope 3
          test_box_string_scope_drop 0
          test_vec_string_scope_drop 0
          test_loop_continue_nested_if_drop 4
          test_for_continue_drop_step 8
          test_loop_break_drop 0
          test_nested_loop_inner_break_drop 11
          test_tuple_string_scope_drop 3
          test_array_string_scope_drop 0
          test_drop_order_locals_struct_defer 0
          test_vec_set_string 0
          test_tuple_vec_int 42
          test_channel_queued_string_drop 0
          test_channel_string 3
          test_channel_send_closed 9
          EOF

      - name: Generated C thread sanitizer (Linux)
        shell: bash
        env:
          COMPILER: ${{ github.workspace }}/target/release/ion-compiler
          CC: gcc
          CFLAGS: -fsanitize=thread -fno-omit-frame-pointer
          LDFLAGS: -fsanitize=thread
        run: |
          cd tests
          "$CC" $CFLAGS -c ../runtime/ion_runtime.c -I. -I.. -I../runtime -o .ion_test_runtime_tsan.o
          while IFS=$'\t' read -r test kind expected _rest; do
            [ "$kind" = "run" ] || continue
            case "$test" in
              test_channel_*|test_spawn_*|test_join|test_select|test_select_*|test_try_recv) ;;
              *) continue ;;
            esac
            [ -f "${test}.ion" ] || continue
            "$COMPILER" "${test}.ion" >/dev/null
            "$CC" $CFLAGS "${test}.c" .ion_test_runtime_tsan.o -I. -I.. -I../runtime -lpthread $LDFLAGS -o "$test"
            set +e
            "./$test" >/dev/null
            status=$?
            set -e
            if [ "$status" -ne "$expected" ]; then
              echo "$test: expected exit $expected, got $status"
              exit 1
            fi
            rm -f "${test}.c" "$test"
          done < <(awk -F '\t' 'NR > 1 && $2 == "run" && ($1 ~ /^test_channel_/ || $1 ~ /^test_spawn_/ || $1 == "test_join" || $1 ~ /^test_select/ || $1 == "test_try_recv") { print $1, $2, $3 }' test_expectations.tsv)

      - name: Large codegen smoke (Linux)
        shell: bash
        env:
          COMPILER: ${{ github.workspace }}/target/release/ion-compiler
          CC: gcc
          CFLAGS: -Wall -Wextra -Werror
        run: bash tests/large_codegen_smoke.sh

      - name: Generated C warning-clean (Linux)
        shell: bash
        env:
          COMPILER: ${{ github.workspace }}/target/release/ion-compiler
          ION_BUILD: ${{ github.workspace }}/target/release/ion-build
          CC: gcc
          CFLAGS: -Wall -Wextra -Werror
          RUNTIME_OBJ: .ion_test_runtime_werror.o
        run: cd tests && bash test_runner.sh

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.96.0"

      - uses: Swatinem/rust-cache@v2

      # Lib LSP tests spawn `target/{debug,release}/ion-lsp` (not the deps test harness).
      - run: cargo build --bin ion-lsp
      - run: cargo test
      - run: cargo build --release --bin ion-compiler --bin ion-build --bin ion-lsp
      - run: ./target/release/ion-compiler --version
      - run: ./target/release/ion-build --version

      - name: Integration tests (macOS)
        shell: bash
        env:
          COMPILER: ${{ github.workspace }}/target/release/ion-compiler
          ION_BUILD: ${{ github.workspace }}/target/release/ion-build
          CC: clang
        run: cd tests && bash test_runner.sh

  integration:
    permissions:
      contents: read

    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.96.0"

      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release --bin ion-compiler --bin ion-build

      - name: Integration tests (Windows)
        shell: bash
        env:
          COMPILER: ${{ github.workspace }}/target/release/ion-compiler
          ION_BUILD: ${{ github.workspace }}/target/release/ion-build
        run: cd tests && bash test_runner.sh
